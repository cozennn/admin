<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>NorDa Admin</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js" defer></script></head>
<body data-protected>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark small">N</span><span>NorDa <span class="muted">/ Admin</span></span></a><div class="top-actions"><button class="button button-quiet" data-language-toggle>English</button><button class="button button-outline" data-logout data-i18n="logout">تسجيل الخروج</button></div></header>
<main class="page-shell"><section class="page-heading"><div><p class="eyebrow" data-i18n="overviewEyebrow">مساحة الإدارة</p><h1 data-i18n="overviewTitle">نظرة عامة</h1><p class="muted" data-i18n="overviewSubtitle">ملخص سريع لنشاط موقعك.</p></div></section>
<p id="page-error" class="form-error" role="alert" hidden></p>
<section class="stats-grid" aria-label="Statistics"><article class="stat-card"><span class="stat-label" data-i18n="projectRequests">طلبات المشاريع</span><strong id="requests-count">—</strong><span class="stat-note" data-i18n="allRequests">كل الطلبات</span></article><article class="stat-card"><span class="stat-label" data-i18n="openTickets">التذاكر المفتوحة</span><strong id="tickets-count">—</strong><span class="stat-note" data-i18n="needsAttention">تحتاج إلى المتابعة</span></article><article class="stat-card"><span class="stat-label" data-i18n="messages">الرسائل</span><strong id="messages-count">—</strong><span class="stat-note" data-i18n="allMessages">كل الرسائل</span></article></section>
<section class="section-block"><h2 data-i18n="manageTitle">إدارة الموقع</h2><div class="link-grid"><a class="nav-card" href="requests.html"><span class="nav-icon">↗</span><span><strong data-i18n="requestsLink">طلبات المشاريع</strong><small data-i18n="requestsDescription">عرض الطلبات الواردة وتفاصيلها</small></span><span class="arrow">←</span></a><a class="nav-card" href="tickets.html"><span class="nav-icon">☷</span><span><strong data-i18n="ticketsLink">التذاكر</strong><small data-i18n="ticketsDescription">قراءة محادثات الدعم</small></span><span class="arrow">←</span></a><a class="nav-card" href="account.html"><span class="nav-icon">◉</span><span><strong data-i18n="accountLink">الحساب</strong><small data-i18n="accountDescription">عرض معلومات الحساب</small></span><span class="arrow">←</span></a></div></section><footer class="page-footer">NorDa Admin <span>·</span> <span data-i18n="privateWorkspace">مساحة إدارة خاصة</span></footer></main>
<script>
(async()=>{try{await checkAuth();const [r,t]=await Promise.all([apiFetch('/api/admin/requests'),apiFetch('/api/admin/tickets')]);for(const res of [r,t])if(!res.ok)throw new Error('load');const rd=await r.json(),td=await t.json();document.getElementById('requests-count').textContent=Array.isArray(rd)?rd.length:(rd.requests||[]).length;document.getElementById('tickets-count').textContent=(Array.isArray(td)?td:(td.tickets||[])).filter(x=>x.status==='open').length;document.getElementById('messages-count').textContent=typeof td.message_count==='number'?td.message_count:'—';}catch(e){document.getElementById('page-error').textContent=currentLanguage()==='ar'?'تعذّر تحميل الإحصاءات. تحققي من نقاط API.':'Could not load statistics. Check the API endpoints.';document.getElementById('page-error').hidden=false;}})();
</script></body></html>
