<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Account | NorDa Admin</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js" defer></script></head>
