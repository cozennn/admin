<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Tickets | NorDa Admin</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js" defer></script></head>
<body data-protected><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark small">N</span><span>NorDa <span class="muted">/ Admin</span></span></a><div class="top-actions"><button class="button button-quiet" data-language-toggle>English</button><button class="button button-outline" data-logout data-i18n="logout">تسجيل الخروج</button></div></header>
<main class="page-shell"><a class="back-link" href="index.html" data-i18n="backDashboard">← العودة إلى لوحة التحكم</a><section class="page-heading"><div><p class="eyebrow">NORDA / SUPPORT</p><h1 data-i18n="ticketsTitle">التذاكر</h1><p class="muted" data-i18n="ticketsSubtitle">اختاري تذكرة لقراءة رسائلها.</p></div></section><p id="ticket-error" class="form-error" hidden></p><div class="tickets-layout"><section class="panel"><h2 data-i18n="allTickets">كل التذاكر</h2><div id="ticket-list" class="ticket-list"><p class="empty-state" data-i18n="loading">جارٍ التحميل…</p></div></section><section class="panel"><h2 id="messages-heading" data-i18n="ticketMessages">رسائل التذكرة</h2><div id="message-list" class="message-list"><p class="empty-state" data-i18n="chooseTicket">اختاري تذكرة لعرض الرسائل.</p></div></section></div></main>
<script>
(async()=>{const list=document.getElementById('ticket-list'),messages=document.getElementById('message-list');try{await checkAuth();const res=await apiFetch('/api/admin/tickets');if(!res.ok)throw new Error('load');const payload=await res.json();const rows=Array.isArray(payload)?payload:(payload.tickets||[]);list.replaceChildren();if(!rows.length){list.textContent=currentLanguage()==='ar'?'لا توجد تذاكر.':'No tickets yet.';return;}rows.forEach(ticket=>{const b=document.createElement('button');b.type='button';b.className='ticket-item';b.innerHTML='<strong></strong><span class="status-pill"></span><small></small>';b.children[0].textContent='#'+ticket.id+' · '+(ticket.user_name||'—');b.children[1].textContent=ticket.status||'—';b.children[2].textContent=ticket.created_at||'—';b.addEventListener('click',async()=>{document.querySelectorAll('.ticket-item').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('messages-heading').textContent=(currentLanguage()==='ar'?'رسائل التذكرة #':'Ticket messages #')+ticket.id;messages.replaceChildren();const loading=document.createElement('p');loading.className='empty-state';loading.textContent=currentLanguage()==='ar'?'جارٍ التحميل…':'Loading…';messages.append(loading);try{const mr=await apiFetch('/api/admin/tickets/'+encodeURIComponent(ticket.id));if(!mr.ok)throw new Error();const data=await mr.json();const items=Array.isArray(data)?data:(data.messages||[]);messages.replaceChildren();if(!items.length){messages.textContent=currentLanguage()==='ar'?'لا توجد رسائل لهذه التذكرة.':'No messages for this ticket.';return;}items.forEach(msg=>{const article=document.createElement('article');article.className='message-item';const meta=document.createElement('div');meta.className='message-meta';meta.textContent=(msg.sender_name||msg.user_name||msg.sender||'')+' · '+(msg.created_at||'');const content=document.createElement('p');content.textContent=msg.message||msg.content||msg.body||'';article.append(meta,content);messages.append(article);});}catch(e){messages.textContent=currentLanguage()==='ar'?'تعذّر تحميل الرسائل.':'Could not load messages.';}});list.append(b);});}catch(e){document.getElementById('ticket-error').textContent=currentLanguage()==='ar'?'تعذّر تحميل التذاكر.':'Could not load tickets.';document.getElementById('ticket-error').hidden=false;list.replaceChildren();}})();
</script></body></html>
