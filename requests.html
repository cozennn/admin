<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Project Requests | NorDa Admin</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js" defer></script></head>
<body data-protected><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark small">N</span><span>NorDa <span class="muted">/ Admin</span></span></a><div class="top-actions"><button class="button button-quiet" data-language-toggle>English</button><button class="button button-outline" data-logout data-i18n="logout">تسجيل الخروج</button></div></header>
<main class="page-shell"><a class="back-link" href="index.html" data-i18n="backDashboard">← العودة إلى لوحة التحكم</a><section class="page-heading"><div><p class="eyebrow">NORDA / DATA</p><h1 data-i18n="requestsTitle">طلبات المشاريع</h1><p class="muted" data-i18n="requestsSubtitle">الطلبات التي أرسلها العملاء عبر الموقع.</p></div></section><p id="table-error" class="form-error" hidden></p><div class="table-wrap"><table><thead><tr><th>ID</th><th data-i18n="name">الاسم</th><th data-i18n="email">البريد الإلكتروني</th><th data-i18n="subject">الموضوع</th><th data-i18n="status">الحالة</th><th data-i18n="createdAt">تاريخ الإنشاء</th></tr></thead><tbody id="requests-body"><tr><td colspan="6" class="empty-state" data-i18n="loading">جارٍ التحميل…</td></tr></tbody></table></div><footer class="page-footer"><span id="row-count">—</span> <span data-i18n="records">سجلات</span></footer></main>
<script>
(async()=>{const body=document.getElementById('requests-body');try{await checkAuth();const res=await apiFetch('/api/admin/requests');if(!res.ok)throw new Error('load');const payload=await res.json();const rows=Array.isArray(payload)?payload:(payload.requests||[]);body.replaceChildren();if(!rows.length){body.innerHTML='<tr><td colspan="6" class="empty-state" data-i18n="noRequests">لا توجد طلبات بعد.</td></tr>';applyLanguage();}else rows.forEach(item=>{const tr=document.createElement('tr');['id','name','email','subject','status','created_at'].forEach(key=>{const td=document.createElement('td');td.textContent=item[key]??'—';if(key==='status')td.innerHTML='';if(key==='status'){const tag=document.createElement('span');tag.className='status-pill';tag.textContent=item[key]??'—';td.append(tag);}tr.append(td);});body.append(tr);});document.getElementById('row-count').textContent=rows.length; }catch(e){document.getElementById('table-error').textContent=currentLanguage()==='ar'?'تعذّر تحميل الطلبات.':'Could not load project requests.';document.getElementById('table-error').hidden=false;body.replaceChildren();}})();
</script></body></html>
